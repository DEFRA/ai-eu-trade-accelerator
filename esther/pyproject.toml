[project]
name = "esther"
version = "0.1.0"
description = "Esther — final pipeline step: shape the audit for the content-audit frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "textstat>=0.7",
    "typer>=0.15",
]

[project.scripts]
esther = "esther.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esther"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
reportMissingTypeStubs = false
