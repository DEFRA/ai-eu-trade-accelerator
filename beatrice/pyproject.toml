[project]
name = "beatrice"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.8.0",
    "openai>=1.76.0",
    "anthropic>=0.40",
]

[project.scripts]
beatrice = "beatrice.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beatrice"]

[tool.hatch.build.targets.wheel.force-include]
"src/beatrice/pipeline/data/topic_taxonomy.json" = "beatrice/pipeline/data/topic_taxonomy.json"
