[project]
name = "susan"
version = "0.1.0"
description = "Susan — atomic proposition extraction from GOV.UK guidance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.28",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "typer>=0.15",
]

[project.scripts]
susan = "susan.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.29",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/susan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
exclude = ["**/__pycache__"]
reportMissingTypeStubs = false
